services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: itzmizzle/wagmi:frontend
    container_name: wagmios-frontend
    ports:
      - "${WAGMIOS_FRONTEND_BIND:-127.0.0.1}:5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wagmios-network
    restart: unless-stopped
    volumes:
      - frontend_data:/app/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: itzmizzle/wagmi:backend
    container_name: wagmios-backend
    ports:
      - "${WAGMIOS_BACKEND_BIND:-127.0.0.1}:5179:5179"
    volumes:
      - wagmios_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WAGMIOS_HOST_CONTAINERS_DIR:-${WAGMIOS_HOST_PATH:-${PWD}/data}/containers}:/app/data/containers
    environment:
      - PORT=5179
      - WAGMIOS_DATA_DIR=/app/data
      - WAGMIOS_HOST_CONTAINERS_DIR=${WAGMIOS_HOST_CONTAINERS_DIR:-${WAGMIOS_HOST_PATH:-${PWD}/data}/containers}
      - WAGMIOS_CONTAINER_CONTAINERS_DIR=/app/data/containers
    networks:
      - wagmios-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5179/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  wagmios-network:
    driver: bridge

volumes:
  frontend_data:
  wagmios_data:
